name: Keep scheduled workflows enabled

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1,15 * *"

# GitHub disables scheduled workflows after 60 days without repository
# activity; the season runs to January 2027. Re-enabling keeps the cron alive.
permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in run_bot_on_tournament.yaml keepalive.yaml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
